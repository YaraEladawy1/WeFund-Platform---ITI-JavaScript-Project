<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start a Campaign | WeFund</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header>
    <h1>WeFund</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="campaigns.html">Explore</a>
        <a href="my-campaigns.html">My Campaigns</a>
        <a href="#" id="logoutBtn">Logout</a>
    </nav>
</header>

<div class="container" style="max-width:800px;margin:40px auto;padding:20px;">
    <section class="auth-container">
        <div class="auth-box" style="background:#fff;padding:30px;border-radius:16px;box-shadow:var(--shadow);">
            <h2>Launch a campaign</h2>
            <p style="color:#666;margin:8px 0 20px;">Required: title, description, goal, deadline. Cover image is read in the browser and stored as a <strong>Base64</strong> string in <code>db.json</code> (per project specification).</p>
            <form id="createCampaignForm">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                    <div class="form-group" style="margin-bottom:12px;">
                        <label>Title</label>
                        <input type="text" id="title" required placeholder="Campaign name" style="width:100%;padding:10px;">
                    </div>
                    <div class="form-group" style="margin-bottom:12px;">
                        <label>Goal ($)</label>
                        <input type="number" id="goal" required min="1" placeholder="5000" style="width:100%;padding:10px;">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom:12px;">
                    <label>Deadline</label>
                    <input type="date" id="deadline" required style="width:100%;padding:10px;">
                </div>
                <div class="form-group" style="margin-bottom:12px;">
                    <label>Category</label>
                    <select id="category" style="width:100%;padding:10px;">
                        <option value="environment">Environment</option>
                        <option value="education">Education</option>
                        <option value="health">Health</option>
                        <option value="community">Community</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:12px;">
                    <label>Cover image (JPEG/PNG, stored as Base64)</label>
                    <input type="file" id="imageFile" accept="image/*" required>
                </div>
                <div class="form-group" style="margin-bottom:12px;">
                    <label>Description</label>
                    <textarea id="description" rows="5" required placeholder="Tell your story..." style="width:100%;padding:10px;"></textarea>
                </div>
                <button type="submit" class="primary-btn">Submit for approval (POST /campaigns)</button>
            </form>
        </div>
    </section>
</div>

<script src="../js/api.js"></script>
<script src="../js/create-campaigns.js"></script>
</body>
</html>
