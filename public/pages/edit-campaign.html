<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Campaign | WeFund</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header>
    <h1>WeFund</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="my-campaigns.html">My Campaigns</a>
        <a href="#" id="logoutBtn">Logout</a>
    </nav>
</header>

<div class="container" style="max-width:800px;margin:40px auto;padding:20px;">
    <div id="editFormWrap">
        <h2>Edit campaign</h2>
        <p style="color:#666;margin-bottom:20px;">Update deadline, goal, text, category, or optionally replace the cover image (Base64).</p>
        <form id="editCampaignForm">
            <div class="form-group" style="margin-bottom:16px;">
                <label>Title</label>
                <input type="text" id="title" required style="width:100%;padding:10px;">
            </div>
            <div class="form-group" style="margin-bottom:16px;">
                <label>Goal ($)</label>
                <input type="number" id="goal" required style="width:100%;padding:10px;">
            </div>
            <div class="form-group" style="margin-bottom:16px;">
                <label>Deadline</label>
                <input type="date" id="deadline" required style="width:100%;padding:10px;">
            </div>
            <div class="form-group" style="margin-bottom:16px;">
                <label>Category</label>
                <select id="category" style="width:100%;padding:10px;">
                    <option value="environment">Environment</option>
                    <option value="education">Education</option>
                    <option value="health">Health</option>
                    <option value="community">Community</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:16px;">
                <label>Description</label>
                <textarea id="description" rows="5" required style="width:100%;padding:10px;"></textarea>
            </div>
            <div class="form-group" style="margin-bottom:16px;">
                <label>New cover image (optional)</label>
                <input type="file" id="imageFile" accept="image/*">
            </div>
            <button type="submit" class="primary-btn">Save changes (PATCH)</button>
        </form>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/edit-campaign.js"></script>
</body>
</html>
